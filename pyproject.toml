[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unimodal-plantar-kinetics"
version = "0.1.0"
description = "Maintained research workflows for kinematics- and insole-based plantar kinetics reconstruction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3", "scipy>=1.12,<2", "h5py>=3.10,<4",
    "matplotlib>=3.8,<4", "tensorflow==2.20.0"
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
maintain = ["ruff>=0.9,<1", "nbformat>=5.10,<6"]

[project.scripts]
kinetics = "kinetics.__main__:main"

[tool.setuptools.packages.find]
include = ["kinetics*", "models*"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
